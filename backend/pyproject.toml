[project]
name = "sutradhar-backend"
version = "0.1.0"
description = "Sutradhar backend — FastAPI provenance and attestation service."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "orjson>=3.10",
    # --- Config / validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "jsonschema>=4.23",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # --- Auth / crypto ---
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "cryptography>=43.0",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    # --- HTTP ---
    "httpx>=0.27",
    "tenacity>=9.0",
    # --- Chain ---
    "web3>=6",
    "eth-account>=0.13",
    "eth-utils>=5.0",
    "eth-hash[pycryptodome]>=0.7",
    # --- Media / QR ---
    "qrcode[pil]>=8.0",
    # --- Ops ---
    "apscheduler>=3.10",
    "structlog>=24.4",
    "uuid-utils>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "respx>=0.21",
    "freezegun>=1.5",
    "factory-boy>=3.3",
    "faker>=30.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-jsonschema>=4.23",
    "zxing-cpp>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]
exclude = [".venv", "alembic/versions", "keys", "media_mirror"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["alembic.*", "apscheduler.*", "authlib.*", "factory.*", "qrcode.*", "web3.*", "eth_account.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
omit = ["app/*/__init__.py"]
