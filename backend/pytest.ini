[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
; Session scope for both, so the session-scoped engine fixture and the tests
; that use it share one event loop. Mixing scopes makes asyncpg connections
; created on one loop get awaited on another.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
; Load tests are excluded by default. They spawn a real uvicorn, seed ten
; thousand rows and take minutes, which is the wrong price for the run somebody
; does before every commit. Run them deliberately: `pytest tests/load -m load`.
;
; A `-m` on the command line REPLACES this one rather than combining with it,
; so `pytest -m "not chain"` selects the load tests. Any hand-written marker
; expression meaning "the normal run" has to say `not load` itself, which is
; why the commands in the README do.
addopts = --strict-markers --strict-config -ra -m "not load"
markers =
    unit: pure logic, no I/O, no database
    integration: touches PostgreSQL or the full ASGI app
    chain: talks to an EVM JSON-RPC node
    load: measures throughput or latency against a real server; slow, opt-in
    contract: checks docs/API_CONTRACT.md against the shipped application
filterwarnings =
    error::DeprecationWarning:app.*
